[package]
name = "daemon"
version = "0.0.0"
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
publish = false

[dependencies]
common = { path = "../common" }
mp3sync = { path = "../mp3sync" }
spsync = { path = "../spsync" }
tokio = { version = "1.48.0", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3.24.0"

[lints]
workspace = true
