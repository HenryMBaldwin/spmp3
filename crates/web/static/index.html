<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spmp3</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #16161a;
    --dim: #6b6b76;
    --faint: #b9b9c2;
    --bad: #a32d2d;
    --bg: #fbfbfa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #d6d6dc; --dim: #8a8a95; --faint: #3d3d46; --bad: #e08585; --bg: #101012; }
  }
  * { box-sizing: border-box; }
  body {
    font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--fg); background: var(--bg);
    max-width: 62rem; margin: 0 auto; padding: 3rem 1.5rem 5rem;
  }
  h1 { font: inherit; font-weight: 600; margin: 0 0 2rem; }
  h1::before { content: "$ "; color: var(--faint); }
  section { margin: 0 0 2rem; }
  .label { color: var(--dim); }
  .k { color: var(--dim); display: inline-block; min-width: 9rem; }
  .sep { color: var(--faint); }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 0 1rem 0 0; vertical-align: top; white-space: nowrap; }
  td.err { color: var(--bad); white-space: normal; }
  td.wrap { white-space: normal; }
  .rule { color: var(--faint); margin: 0 0 .5rem; user-select: none; overflow: hidden; }
  button {
    font: inherit; color: var(--fg); background: none;
    border: 0; padding: 0; margin-right: 1.5rem; cursor: pointer;
  }
  button::before { content: "[ "; color: var(--faint); }
  button::after  { content: " ]"; color: var(--faint); }
  button:hover:not([disabled]) { color: var(--fg); text-decoration: underline; }
  button[disabled] { color: var(--faint); cursor: default; }
  #chosen { color: var(--dim); }
  #bar { width: 100%; height: .35rem; margin-top: 1rem; }
  #log { white-space: pre-wrap; color: var(--dim); margin-top: 1rem;
         max-height: 20rem; overflow-y: auto; }
  #support:empty { display: none; }
  #support { color: var(--bad); margin: 0 0 1.5rem; }
  #notice:empty { display: none; }
  #notice { margin: 0 0 1.5rem; padding: .5rem .75rem; border-left: 2px solid var(--faint); }
  #notice.bad { color: var(--bad); border-left-color: var(--bad); }
  #notice.ok { color: var(--dim); }
  #notice.busy { color: var(--dim); font-style: italic; }
  .empty { color: var(--dim); }
  td.act { text-align: right; white-space: nowrap; }
  button.mini { margin: 0 0 0 1rem; font-size: inherit; }
  button.mini::before { content: "["; }
  button.mini::after  { content: "]"; }
  .state { color: var(--dim); }
  .pending { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<h1>spmp3</h1>

<p id="support"></p>
<p id="notice"></p>

<section id="status">
  <div class="rule">──────────────────────────────────────────────────────────────────────</div>
  <div class="empty">loading status...</div>
</section>

<section>
  <div class="rule">──────────────────────────────────────────────────────────────────────</div>
  <button id="pick">choose player</button>
  <button id="sync" disabled>sync</button>
  <span id="chosen"></span>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="log"></div>
</section>

<script>
const RULE = '─'.repeat(70);

function bytes(n) {
  if (!n) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i >= 2 ? v.toFixed(1) : Math.round(v)) + ' ' + u[i];
}

function ago(ts) {
  if (!ts) return 'never';
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function stamp(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

function row(k, v) {
  return `<div><span class="k">${esc(k)}</span>${v}</div>`;
}

let overrides = { entries: {} };

function idOf(uri) {
  return String(uri || '').split(':').pop();
}

function nameOf(f) {
  if (f.artist || f.title) {
    return `${esc(f.artist)}${f.artist && f.title ? ' &mdash; ' : ''}${esc(f.title)}`;
  }
  return `<span class="empty">${esc(f.uri)}</span>`;
}

function plainName(f) {
  return [f.artist, f.title].filter(Boolean).join(' - ') || f.uri || '';
}

function renderStatus(s) {
  const el = document.getElementById('status');
  const lib = s.library || {};
  const run = s.last_run;
  const dev = s.device;
  const fails = s.failures || [];
  const dim = (t) => `<span class="sep">${esc(t)}</span>`;

  let html = `<div class="rule">${RULE}</div>`;

  if (!s.authenticated && !s.updated_at) {
    html += row('spotify', '<span class="empty">not authorized &mdash; run the login container</span>');
  }

  html += row('library',
    `${lib.tracks ?? 0} tracks ${dim('·')} ${lib.liked ?? 0} liked ${dim('·')} ${bytes(lib.bytes)}`);

  if (run) {
    const bits = [];
    if (run.added) bits.push(`+${run.added} added`);
    if (run.restored) bits.push(`${run.restored} restored`);
    if (run.removed) bits.push(`${run.removed} removed`);
    if (!bits.length) bits.push('no changes');
    html += row('last sync',
      `${stamp(run.finished_at)} ${dim('·')} ${ago(run.finished_at)} ${dim('·')} ${bits.join(' ' + dim('·') + ' ')}`);
  } else {
    html += row('last sync', '<span class="empty">not yet run</span>');
  }

  if (dev) {
    html += row('device',
      `${dev.files} files ${dim('·')} ${stamp(dev.synced_at)} ${dim('·')} ${dev.pending ? dev.pending + ' pending' : 'in sync'}`);
  } else {
    html += row('device', '<span class="empty">never synced</span>');
  }

  const pendingFails = fails.filter((f) => !overrides.entries[idOf(f.uri)]);
  if (pendingFails.length) {
    html += `<div style="margin-top:1.5rem"><span class="label">failed downloads (${pendingFails.length})</span></div>`;
    html += '<table>';
    for (const f of pendingFails) {
      const id = idOf(f.uri);
      const label = plainName(f).replace(/"/g, '&quot;');
      html += `<tr>`
        + `<td class="wrap">${nameOf(f)}</td>`
        + `<td class="err">${esc(f.error)}</td>`
        + `<td class="act">`
        + `<button class="mini" data-act="ignore" data-id="${esc(id)}" data-label="${label}">remove</button>`
        + `<button class="mini" data-act="source" data-id="${esc(id)}" data-label="${label}">youtube</button>`
        + `</td></tr>`;
    }
    html += '</table>';
  }

  const entries = Object.entries(overrides.entries || {});
  if (entries.length) {
    const failedById = {};
    for (const f of fails) failedById[idOf(f.uri)] = f.error;

    html += `<div style="margin-top:1.5rem"><span class="label">overrides (${entries.length})</span></div>`;
    html += '<table>';
    for (const [id, o] of entries) {
      const name = o.label ? esc(o.label) : `<span class="empty">${esc(id)}</span>`;
      const err = failedById[id];
      let state;
      if (o.action === 'ignore') {
        state = '<span class="state">removed from sync</span>';
      } else if (err) {
        state = `<span class="state">youtube</span> <span class="err">${esc(err)}</span>`;
      } else {
        state = `<span class="state">youtube &mdash; ${esc(o.url)}</span>`;
      }
      html += `<tr><td class="wrap">${name}</td><td class="wrap">${state}</td>`
        + `<td class="act"><button class="mini" data-act="clear" data-id="${esc(id)}">undo</button></td></tr>`;
    }
    html += '</table>';
  }

  if (s.updated_at) {
    html += `<div style="margin-top:1rem"><span class="k">updated</span>${dim(ago(s.updated_at))}</div>`;
  }

  el.innerHTML = html;

  for (const b of el.querySelectorAll('button.mini')) {
    b.onclick = () => act(b.dataset.act, b.dataset.id, b.dataset.label || '');
  }
}

function notice(msg, kind) {
  const el = document.getElementById('notice');
  el.className = kind || '';
  el.textContent = msg;
}

async function act(action, id, label) {
  const body = { action, id, label };
  const what = label || id;

  if (action === 'source') {
    const url = prompt(`youtube url for:\n${what}`);
    if (!url) return;
    body.url = url.trim();
  }

  for (const b of document.querySelectorAll('button.mini')) b.disabled = true;
  notice(`saving ${action} for ${what}...`, 'busy');

  try {
    const res = await fetch('/api/overrides', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const text = await res.text();
    if (!res.ok) throw new Error(text || `HTTP ${res.status}`);

    overrides = JSON.parse(text);
    const done = action === 'clear'
      ? `cleared override for ${what}`
      : `saved: ${what} will ${action === 'ignore' ? 'be skipped' : 'be fetched from youtube'} on the next library sync`;
    notice(done, 'ok');
    log(done);
    await loadStatus();
  } catch (e) {
    const msg = `could not save ${action} for ${what}: ${e.message || e}`;
    notice(msg, 'bad');
    log(msg);
    for (const b of document.querySelectorAll('button.mini')) b.disabled = false;
  }
}

async function loadStatus() {
  try {
    const [status, over] = await Promise.all([
      fetch('/api/status').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('/api/overrides').then((r) => (r.ok ? r.json() : { entries: {} })).catch(() => ({ entries: {} })),
    ]);
    overrides = over;
    renderStatus(status);
  } catch (e) {
    document.getElementById('status').innerHTML =
      `<div class="rule">${RULE}</div><div class="empty">status unavailable (${esc(e.message || e)})</div>`;
  }
}

loadStatus();
setInterval(loadStatus, 30000);

const CONCURRENCY = 4;
const out = document.getElementById('log');
const bar = document.getElementById('bar');
let root = null;

function log(msg) {
  out.textContent += msg + '\n';
  out.scrollTop = out.scrollHeight;
}

if (!window.showDirectoryPicker) {
  document.getElementById('support').textContent =
    'This browser cannot write to the player. Use a Chromium-based desktop browser.';
  document.getElementById('pick').disabled = true;
}

const ID_DESCRIPTION = 'SPMP3_TRACK_ID';
const ID_WINDOW = 4096;

function syncsafe(b, o) {
  return (b[o] << 21) | (b[o + 1] << 14) | (b[o + 2] << 7) | b[o + 3];
}

async function readTrackId(handle) {
  try {
    const blob = (await handle.getFile()).slice(0, ID_WINDOW);
    const b = new Uint8Array(await blob.arrayBuffer());
    if (b.length < 10 || String.fromCharCode(b[0], b[1], b[2]) !== 'ID3') return null;
    const end = Math.min(b.length, 10 + syncsafe(b, 6));
    const text = new TextDecoder('utf-8');
    let i = 10;
    while (i + 10 <= end) {
      const id = String.fromCharCode(b[i], b[i + 1], b[i + 2], b[i + 3]);
      if (id === '\0\0\0\0') break;
      const size = syncsafe(b, i + 4);
      if (id === 'TXXX' && i + 10 + size <= b.length) {
        const body = b.subarray(i + 11, i + 10 + size);
        const split = body.indexOf(0);
        if (split > -1) {
          const desc = text.decode(body.subarray(0, split));
          if (desc === ID_DESCRIPTION) {
            return text.decode(body.subarray(split + 1)).replace(/\0+$/, '');
          }
        }
      }
      i += 10 + size;
    }
  } catch { /* unreadable file, fall back to path matching */ }
  return null;
}

async function walk(dir, prefix, found) {
  for await (const [name, handle] of dir.entries()) {
    const path = prefix ? prefix + '/' + name : name;
    if (handle.kind === 'directory') await walk(handle, path, found);
    else if (name.toLowerCase().endsWith('.mp3')) {
      found.push({ path, id: await readTrackId(handle) });
    }
  }
  return found;
}

async function dirFor(segments, create) {
  let dir = root;
  for (const segment of segments) dir = await dir.getDirectoryHandle(segment, { create });
  return dir;
}

async function writeFile(path, body) {
  const parts = path.split('/');
  const name = parts.pop();
  const dir = await dirFor(parts, true);
  const handle = await dir.getFileHandle(name, { create: true });
  const stream = await handle.createWritable();
  await body.pipeTo(stream);
}

async function removeFile(path) {
  const parts = path.split('/');
  const name = parts.pop();
  const dir = await dirFor(parts, false);
  await dir.removeEntry(name);
}

async function moveFile(from, to) {
  const parts = from.split('/');
  const name = parts.pop();
  const dir = await dirFor(parts, false);
  const file = await (await dir.getFileHandle(name)).getFile();
  await writeFile(to, file.stream());
  await dir.removeEntry(name);
}

async function pool(items, worker) {
  let index = 0, done = 0;
  bar.hidden = false; bar.max = items.length; bar.value = 0;
  const runners = Array.from({ length: Math.min(CONCURRENCY, items.length) }, async () => {
    while (index < items.length) {
      const item = items[index++];
      try { await worker(item); } catch (e) { log('  failed: ' + (e.message || e)); }
      bar.value = ++done;
    }
  });
  await Promise.all(runners);
}

document.getElementById('pick').onclick = async () => {
  try {
    root = await window.showDirectoryPicker({ mode: 'readwrite', id: 'spmp3-device' });
  } catch { return; }
  document.getElementById('chosen').textContent = root.name;
  document.getElementById('sync').disabled = false;
  log('selected ' + root.name);
};

document.getElementById('sync').onclick = async () => {
  const sync = document.getElementById('sync');
  sync.disabled = true;
  try {
    log('reading player...');
    const contents = await walk(root, '', []);
    const tagged = contents.filter((f) => f.id).length;
    log(`  found ${contents.length} mp3s (${tagged} identified by tag)`);

    const res = await fetch('/api/plan', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ contents }),
    });
    if (!res.ok) throw new Error('plan failed: ' + res.status);
    const plan = await res.json();
    log(`plan: ${plan.copy.length} to copy, ${plan.rename.length} to move, ${plan.delete.length} to delete`);

    if (plan.rename.length) {
      log('moving...');
      await pool(plan.rename, async (step) => { await moveFile(step.from, step.to); });
    }
    if (plan.copy.length) {
      log('copying...');
      await pool(plan.copy, async (step) => {
        const r = await fetch(step.url);
        if (!r.ok) throw new Error(step.to + ': ' + r.status);
        await writeFile(step.to, r.body);
      });
    }
    if (plan.delete.length) {
      log('deleting...');
      await pool(plan.delete, async (path) => { await removeFile(path); });
    }

    const after = await walk(root, '', []);
    const check = await fetch('/api/plan', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ contents: after }),
    });
    const remaining = await check.json();
    const left = remaining.copy.length + remaining.rename.length + remaining.delete.length;
    log(left === 0 ? 'done, player is in sync' : `done, ${left} step(s) still outstanding`);
  } catch (e) {
    log('error: ' + (e.message || e));
  } finally {
    bar.hidden = true;
    sync.disabled = false;
  }
};
</script>
</body>
</html>
