[package]
name = "spsync"
version = "0.0.0"
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
# TODO: remove when crate is implemented
publish = false

[dependencies]
common = { path = "../common" }
librespot-audio = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-webpki-roots",
] }
librespot-core = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-webpki-roots",
] }
librespot-metadata = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-webpki-roots",
] }
librespot-oauth = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-webpki-roots",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.19"
tokio = { version = "1.48.0", features = ["rt", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lints]
workspace = true
